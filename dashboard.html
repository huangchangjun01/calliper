<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化交易系统 - Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #e6edf3; }
  .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 10px 20px; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 18px; color: #58a6ff; }
  .header .status { font-size: 12px; padding: 3px 10px; border-radius: 10px; }
  .header .status.live { background: #238636; color: #fff; }
  .header .status.error { background: #da3633; color: #fff; }
  .header button { background: #238636; color: #fff; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .header button:hover { background: #2ea043; }
  .header button:disabled { opacity: 0.5; cursor: not-allowed; }
  .header .refresh-info { font-size: 11px; color: #8b949e; margin-left: auto; }
  .layout { display: flex; height: calc(100vh - 48px); }
  
  .sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; overflow-y: auto; padding: 10px; }
  .sidebar h3 { font-size: 13px; color: #8b949e; margin: 8px 0 6px 4px; }
  .stock-item { padding: 6px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
  .stock-item:hover { background: #21262d; }
  .stock-item.active { background: #1f6feb22; border: 1px solid #1f6feb; }
  .stock-item .name { flex: 1; }
  .stock-item .sym { color: #8b949e; font-size: 10px; }
  .stock-item .price { font-weight: 600; min-width: 55px; text-align: right; }
  .up { color: #26a69a; }
  .down { color: #ef5350; }
  .market-section { margin-bottom: 8px; }
  .market-section h4 { font-size: 11px; color: #58a6ff; padding: 3px 4px; border-bottom: 1px solid #30363d; margin-bottom: 3px; }
  
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  
  .top-panel { display: flex; gap: 0; height: 55%; border-bottom: 1px solid #30363d; }
  .chart-area { flex: 1.5; display: flex; flex-direction: column; }
  .toolbar { padding: 6px 12px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; gap: 6px; }
  .toolbar button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .toolbar button.active { background: #1f6feb; border-color: #1f6feb; }
  .toolbar button:hover { background: #30363d; }
  .toolbar button.active:hover { background: #388bfd; }
  .chart-box { flex: 1; position: relative; }
  .chart-box .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #8b949e; }
  
  .pred-panel { flex: 1; background: #0d1117; overflow-y: auto; padding: 8px; border-left: 1px solid #30363d; }
  .pred-panel h3 { font-size: 13px; color: #58a6ff; margin-bottom: 8px; padding: 0 4px; }
  .pred-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 12px; }
  .pred-card .p-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .pred-card .p-name { font-weight: 600; }
  .pred-card .p-dir { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .pred-card .p-dir.up { background: #26a69a22; color: #26a69a; }
  .pred-card .p-dir.down { background: #ef535022; color: #ef5350; }
  .pred-card .p-dir.neutral { background: #8b949e22; color: #8b949e; }
  .pred-card .p-row { display: flex; justify-content: space-between; color: #8b949e; font-size: 11px; }
  .pred-card .p-conf { color: #f5c542; }
  .pred-card .p-signals { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 3px; }
  .pred-card .p-signal { background: #21262d; padding: 1px 5px; border-radius: 3px; font-size: 10px; color: #8b949e; }
  
  .bottom-panel { height: 45%; display: flex; gap: 0; }
  .metrics-panel { flex: 1; padding: 10px; overflow-y: auto; }
  .metrics-panel h3 { font-size: 13px; color: #58a6ff; margin-bottom: 8px; }
  .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .metric-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px; text-align: center; }
  .metric-card .m-label { font-size: 11px; color: #8b949e; }
  .metric-card .m-value { font-size: 20px; font-weight: 700; margin: 4px 0; }
  .metric-card .m-value.positive { color: #26a69a; }
  .metric-card .m-value.negative { color: #ef5350; }
  
  .trade-panel { flex: 1; padding: 10px; overflow-y: auto; }
  .trade-panel h3 { font-size: 13px; color: #58a6ff; margin-bottom: 8px; }
  .trade-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .trade-table th { background: #161b22; padding: 5px 8px; text-align: left; color: #8b949e; border-bottom: 1px solid #30363d; position: sticky; top: 0; }
  .trade-table td { padding: 4px 8px; border-bottom: 1px solid #21262d; }
  .trade-table tr:hover td { background: #161b22; }
  
  .accuracy-panel { flex: 1; padding: 10px; overflow-y: auto; border-left: 1px solid #30363d; }
  .accuracy-panel h3 { font-size: 13px; color: #58a6ff; margin-bottom: 8px; }
  .stock-acc-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-radius: 4px; margin-bottom: 2px; font-size: 11px; }
  .stock-acc-row:hover { background: #21262d; }
  .acc-bar-bg { flex: 1; height: 14px; background: #21262d; border-radius: 3px; margin: 0 8px; overflow: hidden; }
  .acc-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .acc-bar-fill.good { background: #26a69a; }
  .acc-bar-fill.mid { background: #f5c542; }
  .acc-bar-fill.bad { background: #ef5350; }
  
  .info-bar { padding: 6px 16px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 20px; font-size: 12px; color: #8b949e; }
  .info-bar b { color: #e6edf3; }
  
  .tab-nav { display: flex; gap: 2px; margin-bottom: 6px; }
  .tab-nav button { background: #21262d; color: #8b949e; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  .tab-nav button.active { background: #1f6feb; color: #fff; }
</style>
</head>
<body>
<div class="header">
  <h1>量化交易系统</h1>
  <span class="status live" id="sys-status">● 实时</span>
  <button onclick="refreshAll()" id="btn-refresh">刷新数据</button>
  <span class="refresh-info" id="update-time">--</span>
</div>

<div class="layout">
  <div class="sidebar">
    <div id="stock-list"></div>
  </div>

  <div class="main">
    <div class="top-panel">
      <div class="chart-area">
        <div class="toolbar">
          <button class="active" data-period="1m" onclick="switchPeriod('1m', this)">分时</button>
          <button data-period="5m" onclick="switchPeriod('5m', this)">5分</button>
          <button data-period="15m" onclick="switchPeriod('15m', this)">15分</button>
          <button data-period="30m" onclick="switchPeriod('30m', this)">30分</button>
          <button data-period="60m" onclick="switchPeriod('60m', this)">60分</button>
          <button data-period="1d" onclick="switchPeriod('1d', this)">日K</button>
          <button data-period="1w" onclick="switchPeriod('1w', this)">周K</button>
        </div>
        <div class="chart-box" id="chart-container">
          <div class="loading">选择股票查看K线图</div>
        </div>
        <div class="info-bar">
          <span>名称: <b id="info-name">--</b></span>
          <span>代码: <b id="info-symbol">--</b></span>
          <span>最新价: <b id="info-price">--</b></span>
          <span>涨跌: <b id="info-change">--</b></span>
          <span>成交量: <b id="info-volume">--</b></span>
        </div>
      </div>
      <div class="pred-panel" id="pred-panel">
        <h3>预测信号</h3>
        <div id="pred-list" style="color:#8b949e;font-size:12px;">点击"刷新数据"获取预测</div>
      </div>
    </div>

    <div class="bottom-panel">
      <div class="metrics-panel">
        <h3>账户概览</h3>
        <div class="metric-grid" id="metric-grid">
          <div class="metric-card"><div class="m-label">总资产</div><div class="m-value" id="m-assets">--</div></div>
          <div class="metric-card"><div class="m-label">总盈亏</div><div class="m-value" id="m-pnl">--</div></div>
          <div class="metric-card"><div class="m-label">收益率</div><div class="m-value" id="m-return">--</div></div>
          <div class="metric-card"><div class="m-label">夏普比率</div><div class="m-value" id="m-sharpe">--</div></div>
          <div class="metric-card"><div class="m-label">最大回撤</div><div class="m-value" id="m-drawdown">--</div></div>
          <div class="metric-card"><div class="m-label">交易笔数</div><div class="m-value" id="m-trades">--</div></div>
          <div class="metric-card"><div class="m-label">胜率</div><div class="m-value" id="m-winrate">--</div></div>
          <div class="metric-card"><div class="m-label">预测准确率</div><div class="m-value" id="m-accuracy">--</div></div>
        </div>
      </div>
      <div class="trade-panel">
        <h3>交易记录</h3>
        <div style="max-height:calc(100% - 30px);overflow-y:auto;">
          <table class="trade-table">
            <thead><tr><th>股票</th><th>方向</th><th>价格</th><th>数量</th><th>成本</th><th>置信度</th><th>盈亏</th></tr></thead>
            <tbody id="trade-body"><tr><td colspan="7" style="color:#8b949e;text-align:center;">点击"刷新数据"获取交易记录</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="accuracy-panel">
        <h3>个股预测准确率</h3>
        <div id="accuracy-list" style="color:#8b949e;font-size:12px;">点击"刷新数据"获取准确率</div>
      </div>
    </div>
  </div>
</div>

<script>
const STOCK_POOL = {
  'sh600519': { name: '贵州茅台', market: 'SSE', type: 'A股', sina: 'sh600519', tt: 'sh600519' },
  'sz000858': { name: '五粮液', market: 'SZSE', type: 'A股', sina: 'sz000858', tt: 'sz000858' },
  'sz300750': { name: '宁德时代', market: 'SZSE', type: 'A股', sina: 'sz300750', tt: 'sz300750' },
  'sh601318': { name: '中国平安', market: 'SSE', type: 'A股', sina: 'sh601318', tt: 'sh601318' },
  'sh600036': { name: '招商银行', market: 'SSE', type: 'A股', sina: 'sh600036', tt: 'sh600036' },
  'sz000333': { name: '美的集团', market: 'SZSE', type: 'A股', sina: 'sz000333', tt: 'sz000333' },
  'sz002594': { name: '比亚迪', market: 'SZSE', type: 'A股', sina: 'sz002594', tt: 'sz002594' },
  'sh600900': { name: '长江电力', market: 'SSE', type: 'A股', sina: 'sh600900', tt: 'sh600900' },
  'hk00700': { name: '腾讯控股', market: 'HKEX', type: '港股', sina: 'hk00700', tt: 'hk00700' },
  'hk09988': { name: '阿里巴巴', market: 'HKEX', type: '港股', sina: 'hk09988', tt: 'hk09988' },
  'gb_aapl':  { name: 'Apple', market: 'NASDAQ', type: '美股', sina: 'gb_aapl', tt: 'usAAPL.OQ' },
  'gb_msft':  { name: 'Microsoft', market: 'NASDAQ', type: '美股', sina: 'gb_msft', tt: 'usMSFT.OQ' },
  'gb_googl': { name: 'Alphabet', market: 'NASDAQ', type: '美股', sina: 'gb_googl', tt: 'usGOOGL.OQ' },
  'gb_tsla':  { name: 'Tesla', market: 'NASDAQ', type: '美股', sina: 'gb_tsla', tt: 'usTSLA.OQ' },
};

let chart = null;
let currentSymbol = 'sh600519';
let currentPeriod = '1d';
let marketPrices = {};

function initChart() {
  const dom = document.getElementById('chart-container');
  dom.innerHTML = '<div class="loading">选择股票查看K线图</div>';
  chart = echarts.init(dom);
  window.addEventListener('resize', () => chart.resize());
}

function renderStockList() {
  const markets = { SSE: [], SZSE: [], HKEX: [], NASDAQ: [] };
  Object.entries(STOCK_POOL).forEach(([code, info]) => {
    markets[info.market].push({ code, ...info });
  });
  const labels = { SSE: '上海A股', SZSE: '深圳A股', HKEX: '港股', NASDAQ: '美股' };
  let html = '';
  Object.entries(markets).forEach(([market, stocks]) => {
    if (!stocks.length) return;
    html += `<div class="market-section"><h4>${labels[market]}</h4>`;
    stocks.forEach(s => {
      const active = s.code === currentSymbol ? 'active' : '';
      const price = marketPrices[s.code];
      const pct = price ? ((price.price - price.prevClose) / price.prevClose * 100) : 0;
      const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : '';
      html += `<div class="stock-item ${active}" onclick="selectStock('${s.code}')">
        <span class="name">${s.name}<br><span class="sym">${s.code}</span></span>
        <span class="price ${cls}">${price ? price.price.toFixed(2) : '--'}</span>
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('stock-list').innerHTML = html;
}

async function selectStock(symbol) {
  currentSymbol = symbol;
  renderStockList();
  fetchKline(symbol, currentPeriod);
}

function switchPeriod(period, btn) {
  currentPeriod = period;
  document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (currentSymbol) fetchKline(currentSymbol, period);
}

async function fetchKline(symbol, period) {
  const container = document.getElementById('chart-container');
  container.innerHTML = '<div class="loading">加载中...</div>';
  const stock = STOCK_POOL[symbol];
  if (!stock) { container.innerHTML = '<div class="loading">未知股票</div>'; return; }
  
  document.getElementById('info-name').textContent = stock.name;
  document.getElementById('info-symbol').textContent = symbol;
  
  try {
    let data = [];
    if (stock.type === 'A股') {
      const scaleMap = { '1m': '5', '5m': '15', '15m': '30', '30m': '60', '60m': '60', '1d': '240', '1w': '1200' };
      const scale = scaleMap[period] || '240';
      const datalen = period === '1m' ? '240' : '100';
      const resp = await fetch(`https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData?symbol=${stock.sina}&scale=${scale}&ma=no&datalen=${datalen}`, { headers: { 'Referer': 'https://finance.sina.com.cn' } });
      const json = await resp.json();
      data = json.map(d => ({time:d.day,open:parseFloat(d.open),close:parseFloat(d.close),high:parseFloat(d.high),low:parseFloat(d.low),volume:parseInt(d.volume)||0}));
    } else if (stock.type === '港股') {
      const resp = await fetch(`https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData?symbol=${stock.sina}&scale=240&ma=no&datalen=100`, { headers: { 'Referer': 'https://finance.sina.com.cn' } });
      const json = await resp.json();
      data = json.map(d => ({time:d.day,open:parseFloat(d.open),close:parseFloat(d.close),high:parseFloat(d.high),low:parseFloat(d.low),volume:parseInt(d.volume)||0}));
    } else if (stock.type === '美股') {
      const resp = await fetch(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${stock.tt},day,,,100,qfq`, { headers: { 'Referer': 'https://gu.qq.com' } });
      const json = await resp.json();
      const days = json.data?.[stock.tt]?.day || json.data?.[stock.tt]?.qfqday || [];
      data = days.map(d => ({time:d[0],open:parseFloat(d[1]),close:parseFloat(d[2]),high:parseFloat(d[3]),low:parseFloat(d[4]),volume:parseInt(d[5])||0}));
    }
    
    if (!data.length) { container.innerHTML = '<div class="loading">暂无K线数据</div>'; return; }
    
    const last = data[data.length-1], prev = data[data.length-2];
    const change = prev ? ((last.close-prev.close)/prev.close*100) : 0;
    document.getElementById('info-price').textContent = last.close.toFixed(2);
    document.getElementById('info-price').style.color = change>0?'#26a69a':change<0?'#ef5350':'#e6edf3';
    document.getElementById('info-change').textContent = `${change>0?'+':''}${change.toFixed(2)}%`;
    document.getElementById('info-change').style.color = change>0?'#26a69a':change<0?'#ef5350':'#e6edf3';
    document.getElementById('info-volume').textContent = (last.volume/10000).toFixed(0)+'万';
    
    renderChart(data, period);
  } catch(e) { container.innerHTML = `<div class="loading">数据加载失败: ${e.message}</div>`; }
}

function calcMA(data, period) {
  const result = [];
  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) { result.push(null); }
    else { let sum = 0; for (let j = i - period + 1; j <= i; j++) sum += data[j].close; result.push(+(sum / period).toFixed(2)); }
  }
  return result;
}

function renderChart(data, period) {
  const container = document.getElementById('chart-container');
  container.innerHTML = '';
  chart = echarts.init(container);
  
  const isIntraday = ['1m','5m','15m','30m','60m'].includes(period);
  const times = data.map(d => isIntraday ? d.time.slice(-8) : d.time);
  
  const series = isIntraday ? [{
    name:'价格', type:'line', data:data.map(d=>d.close), smooth:false, symbol:'none',
    lineStyle:{color:'#1677ff',width:1.5},
    areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(22,119,255,0.3)'},{offset:1,color:'rgba(22,119,255,0.02)'}])}
  }] : [{
    name:'K线', type:'candlestick', data:data.map(d=>[d.open,d.close,d.low,d.high]),
    itemStyle:{color:'#ef5350',color0:'#26a69a',borderColor:'#ef5350',borderColor0:'#26a69a'}
  },{
    name:'MA5', type:'line', data:calcMA(data,5), smooth:true, symbol:'none', lineStyle:{width:1,color:'#f5c542'}
  },{
    name:'MA10', type:'line', data:calcMA(data,10), smooth:true, symbol:'none', lineStyle:{width:1,color:'#e91e63'}
  },{
    name:'MA20', type:'line', data:calcMA(data,20), smooth:true, symbol:'none', lineStyle:{width:1,color:'#7b1fa2'}
  }];

  chart.setOption({
    backgroundColor:'#0d1117',
    tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'rgba(22,27,34,0.95)',borderColor:'#30363d',textStyle:{color:'#e6edf3',fontSize:12}},
    grid:{left:'3%',right:'3%',top:10,bottom:isIntraday?30:50,containLabel:true},
    xAxis:{type:'category',data:times,axisLine:{lineStyle:{color:'#30363d'}},axisLabel:{color:'#8b949e',fontSize:10}},
    yAxis:{type:'value',scale:true,axisLine:{show:false},axisLabel:{color:'#8b949e',fontSize:10},splitLine:{lineStyle:{color:'#21262d',type:'dashed'}}},
    dataZoom:[{type:'inside',start:50,end:100},...(isIntraday?[]:[{type:'slider',start:50,end:100,height:20,bottom:0,borderColor:'#30363d',backgroundColor:'#161b22',fillerColor:'rgba(31,111,235,0.1)',textStyle:{color:'#8b949e'}}])],
    series
  });
  window.addEventListener('resize',()=>chart.resize());
}

// ============ 预测数据 ============
async function refreshAll() {
  document.getElementById('btn-refresh').disabled = true;
  document.getElementById('sys-status').textContent = '⟳ 加载中...';
  document.getElementById('sys-status').className = 'status';
  
  try {
    const resp = await fetch('/api/predict');
    const data = await resp.json();
    
    if (data.error) {
      document.getElementById('sys-status').textContent = '✕ 错误';
      document.getElementById('sys-status').className = 'status error';
      document.getElementById('btn-refresh').disabled = false;
      return;
    }
    
    // 更新股票价格
    data.market_snapshot.forEach(s => {
      marketPrices[s.code] = { price: s.price, prevClose: s.price / (1 + s.change_pct / 100) };
    });
    renderStockList();
    
    // 更新预测列表
    renderPredictions(data.predictions);
    
    // 更新指标
    renderMetrics(data.metrics, data.accuracy);
    
    // 更新交易记录
    renderTrades(data.trades);
    
    // 更新准确率
    renderAccuracy(data.accuracy);
    
    document.getElementById('sys-status').textContent = '● 实时';
    document.getElementById('sys-status').className = 'status live';
    document.getElementById('update-time').textContent = '更新: ' + data.timestamp;
  } catch(e) {
    document.getElementById('sys-status').textContent = '✕ 错误';
    document.getElementById('sys-status').className = 'status error';
    console.error(e);
  }
  document.getElementById('btn-refresh').disabled = false;
}

function renderPredictions(predictions) {
  const top = predictions.filter(p => p.confidence >= 0.55).slice(0, 10);
  let html = '';
  top.forEach(p => {
    html += `<div class="pred-card" onclick="selectStock('${p.symbol}')" style="cursor:pointer">
      <div class="p-header">
        <span class="p-name">${p.name} <span style="color:#8b949e;font-size:10px">${p.period === 'short' ? '短期' : p.period === 'medium' ? '中期' : '长期'}</span></span>
        <span class="p-dir ${p.direction}">${p.direction === 'up' ? '看涨' : '看跌'}</span>
      </div>
      <div class="p-row">
        <span>当前: ¥${p.current_price.toFixed(2)} → 目标: ¥${p.target_price.toFixed(2)}</span>
        <span class="p-conf">置信度: ${(p.confidence*100).toFixed(0)}%</span>
      </div>
      <div class="p-signals">${p.signals.map(s => `<span class="p-signal">${s}</span>`).join('')}</div>
    </div>`;
  });
  document.getElementById('pred-list').innerHTML = html || '<div style="color:#8b949e">无高置信度预测信号</div>';
}

function renderMetrics(metrics, accuracy) {
  const pnlCls = metrics.total_pnl >= 0 ? 'positive' : 'negative';
  const retCls = metrics.total_return >= 0 ? 'positive' : 'negative';
  document.getElementById('m-assets').innerHTML = '¥' + (metrics.total_assets/10000).toFixed(1) + '<span style="font-size:11px;color:#8b949e">万</span>';
  document.getElementById('m-assets').className = 'm-value';
  document.getElementById('m-pnl').textContent = (metrics.total_pnl >= 0 ? '+' : '') + (metrics.total_pnl/10000).toFixed(2) + '万';
  document.getElementById('m-pnl').className = 'm-value ' + pnlCls;
  document.getElementById('m-return').textContent = (metrics.total_return >= 0 ? '+' : '') + metrics.total_return.toFixed(2) + '%';
  document.getElementById('m-return').className = 'm-value ' + retCls;
  document.getElementById('m-sharpe').textContent = metrics.sharpe_ratio;
  document.getElementById('m-sharpe').className = 'm-value';
  document.getElementById('m-drawdown').textContent = metrics.max_drawdown + '%';
  document.getElementById('m-drawdown').className = 'm-value';
  document.getElementById('m-trades').textContent = metrics.trade_count;
  document.getElementById('m-trades').className = 'm-value';
  document.getElementById('m-winrate').textContent = metrics.win_rate + '%';
  document.getElementById('m-winrate').className = 'm-value';
  document.getElementById('m-accuracy').textContent = accuracy.overall_accuracy + '%';
  document.getElementById('m-accuracy').className = 'm-value';
}

function renderTrades(trades) {
  let html = '';
  trades.forEach(t => {
    const pnl = t.pnl != null ? (t.pnl >= 0 ? `<span class="up">+${t.pnl.toFixed(0)}</span>` : `<span class="down">${t.pnl.toFixed(0)}</span>`) : '--';
    html += `<tr>
      <td>${t.name}</td>
      <td><span class="${t.direction === 'up' ? 'up' : 'down'}">${t.direction === 'up' ? '买入' : '卖出'}</span></td>
      <td>¥${t.price.toFixed(2)}</td>
      <td>${t.quantity}</td>
      <td>¥${t.cost.toFixed(0)}</td>
      <td>${(t.confidence*100).toFixed(0)}%</td>
      <td>${pnl}</td>
    </tr>`;
  });
  document.getElementById('trade-body').innerHTML = html || '<tr><td colspan="7" style="color:#8b949e;text-align:center;">无交易记录</td></tr>';
}

function renderAccuracy(accuracy) {
  const stocks = accuracy.by_stock || [];
  let html = '';
  stocks.forEach(s => {
    const cls = s.accuracy >= 70 ? 'good' : s.accuracy >= 50 ? 'mid' : 'bad';
    html += `<div class="stock-acc-row">
      <span style="width:60px">${s.name}</span>
      <div class="acc-bar-bg"><div class="acc-bar-fill ${cls}" style="width:${s.accuracy}%"></div></div>
      <span style="width:50px;text-align:right">${s.accuracy}%</span>
    </div>`;
  });
  document.getElementById('accuracy-list').innerHTML = html || '<div style="color:#8b949e">无数据</div>';
}

// 初始化
initChart();
renderStockList();
refreshAll();
selectStock('sh600519');
</script>
